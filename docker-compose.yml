services:

  # ── FastAPI web app ────────────────────────────────────────────────────────
  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── Rain alert cron ────────────────────────────────────────────────────────
  cron:
    build: .
    restart: unless-stopped
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      bash -c "apt-get update -qq && apt-get install -y -qq cron &&
               crontab /app/crontab &&
               cron -f"
